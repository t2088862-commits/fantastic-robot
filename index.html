function makeSound(hz, secs, loud){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    if(audioCtx.state == 'suspended') audioCtx.resume()
  } catch(err){
    console.log('no audio :(', err)
    return
  }
  secs = secs || 1.6
  loud = loud || .28
  if(hz > 600) loud = loud * .5
  var now = audioCtx.currentTime
  var vol = audioCtx.createGain()
  vol.gain.setValueAtTime(.0001, now)
  vol.gain.exponentialRampToValueAtTime(loud, now + .01)
  vol.gain.exponentialRampToValueAtTime(.0001, now + secs)
  vol.connect(audioCtx.destination)
  // tried just 1 oscillator, sounded like a microwave
  var layers = [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[4,'sine',.05]]
  if(hz > 600) layers = layers.slice(0, 2)
  layers.forEach(l => {
    var osc = audioCtx.createOscillator()
    var oscVol = audioCtx.createGain()
    osc.type = l[1]
    osc.frequency.value = hz * l[0]
    oscVol.gain.value = l[2]
    osc.connect(oscVol)
    oscVol.connect(vol)
    osc.start(now)
    osc.stop(now + secs + .05)
  })
}

function lightUp(n){
  dotEls.forEach((d, i) => { d.classList.toggle('on', i < n) })

function checkTune(noteName){
  if(unlocked) return
  if(noteName == bdayTune[gotSoFar]){

  }
  else {
    var hadSome = gotSoFar > 0
    gotSoFar = (noteName == bdayTune[0]) ? 1 : 0

  lightUp(gotSoFar)
  if(gotSoFar == bdayTune.length){
    unlocked = true
    msgLine.textContent = "gg freaking easy"
    setTimeout(showNote, 1500)
  }
}

function hitKey(k){
  elOf[k.nm].classList.add('down')

}
function lift(k){ elOf[k.nm].classList.remove('down') }

var fingers = {}
pianoDiv.addEventListener('pointerdown', function(e){
  var el = e.target.closest('.key')
  if(!el) return
  e.preventDefault()
  var k = pianoKeys.find(x => x.nm == el.dataset.note)
  fingers[e.pointerId] = k
  hitKey(k)
})
;['pointerup','pointercancel','pointerleave'].forEach(function(evName){
  pianoDiv.addEventListener(evName, function(e){
    var k = fingers[e.pointerId]
    if(k){ lift(k); delete fingers[e.pointerId] }
  })
})

var chaSound = new Audio('chachacha.mp3')
var beatLen = .42   // tried .5, too slow
var songTimers = []

function stopSong(){
  songTimers.forEach(clearTimeout)
  songTimers = []
  chaSound.pause()
  chaSound.currentTime = 0
  for(var nm in elOf) elOf[nm].classList.remove('down')
}

function playSong(song, beat){
  stopSong()
  song = song || bdaySong
  beat = beat || beatLen
  var clock = .2
  song.forEach(function(item){
    var nm = item[0], beats = item[1]
    if(nm == "cha"){
      songTimers.push(setTimeout(function(){
        chaSound.currentTime = 0
        chaSound.play()
      }, clock * 1000))
    }
    else if(nm == "ch"){
      var chord = item[2], hold = item[3]
      for(let b = 0; b < hold; b++){
        songTimers.push(setTimeout(function(){
          if(b % 3 == 0){
            makeSound(hzOf(chord[0]), beat * 3, .14)
          } else {
            chord.slice(1).forEach(function(c){ makeSound(hzOf(c), beat * 1.5, .06) })
          }
        }, (clock + b * beat) * 1000))
      }
    }
    else if(nm){
      var startMs = clock * 1000
      var duration = beats * beat
      var hz = hzOf(nm)
      songTimers.push(setTimeout(function(){
        makeSound(hz, duration + .9, .22)
        if(elOf[nm]) elOf[nm].classList.add('down')
      }, startMs))
      songTimers.push(setTimeout(function(){
        if(elOf[nm]) elOf[nm].classList.remove('down')
      }, startMs + Math.max(120, duration * 800)))
    }
    clock += beats * beat
  })
}

// confetti code, randomizer needs work ////////////////////////////////////////////////////////////////////
function confettiGo(){
  var canvas = document.getElementById('confetti')
  var pen = canvas.getContext('2d')
  canvas.width = innerWidth
  canvas.height = innerHeight
  var partyColors = ['#e8b04a','#ff5a4e','#222','#6fb7c9','#c78bd6']
  var pieces = []
  for(var i = 0; i < 140; i++){
    pieces.push({
      x: Math.random() * canvas.width,
      y: -Math.random() * canvas.height,
      w: 4 + Math.random() * 6,
      h: 8 + Math.random() * 10,
      fall: 1.5 + Math.random() * 2.5,
      drift: -1 + Math.random() * 2,
      angle: Math.random() * 3,
      spin: -.1 + Math.random() * .2,
      color: partyColors[i % partyColors.length]
    })
  }
  var startTime = performance.now()
  function tick(now){
    pen.clearRect(0, 0, canvas.width, canvas.height)
    var stillGoing = now - startTime < 7000
    var anyOnScreen = false
    pieces.forEach(function(c){
      c.x += c.drift
      c.y += c.fall
      c.angle += c.spin
      if(stillGoing && c.y > canvas.height){ c.y = -20; c.x = Math.random() * canvas.width }
      if(c.y < canvas.height) anyOnScreen = true
      pen.save()
      pen.translate(c.x, c.y)
      pen.rotate(c.angle)
      pen.fillStyle = c.color
      pen.fillRect(-c.w / 2, -c.h / 2, c.w, c.h)
      pen.restore()
    })
    if(stillGoing || anyOnScreen) requestAnimationFrame(tick)
    else pen.clearRect(0, 0, canvas.width, canvas.height)
  }
  tick(startTime)
}
